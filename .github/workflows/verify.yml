name: Verify

on:
  pull_request:
  push:
    branches:
      - main
      - release
      - 'release/**'

permissions:
  contents: read

concurrency:
  group: verify-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Quality gates (Node ${{ matrix.node-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - node-version: '18.20.8'
            engine-strict: false
            verify-easypack: false
          - node-version: '20'
            engine-strict: true
            verify-easypack: true

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --config.engine-strict=${{ matrix.engine-strict }}

      - name: Verify repository integrity
        run: |
          git diff --check
          pnpm changeset status

      - name: Verify declared Node floor
        if: matrix.node-version == '18.20.8'
        run: |
          node <<'NODE'
          const assert = require('node:assert/strict')
          const fs = require('node:fs')

          const node18Manifests = [
            'package.json',
            'packages/core/package.json',
            'packages/create-easy-editor/package.json',
            'packages/plugin-dashboard/package.json',
            'packages/plugin-datasource/package.json',
            'packages/plugin-hotkey/package.json',
            'packages/react-renderer-dashboard/package.json',
            'packages/react-renderer/package.json',
            'packages/renderer-core/package.json',
          ]

          assert.equal(process.version, 'v18.20.8')
          for (const manifestPath of node18Manifests) {
            const manifest = JSON.parse(fs.readFileSync(manifestPath, 'utf8'))
            assert.equal(manifest.engines?.node, '>=18.20.8', manifestPath)
          }
          NODE

      - name: Verify Core kernel
        run: |
          pnpm --filter @easy-editor/core lint
          pnpm --filter @easy-editor/core test-types
          pnpm --filter @easy-editor/core test
          pnpm --filter @easy-editor/core build
          pnpm --filter @easy-editor/core types

      - name: Verify Agent Runtime package
        run: |
          pnpm --filter @easy-editor/agent-runtime lint
          pnpm --filter @easy-editor/agent-runtime test
          pnpm --filter @easy-editor/agent-runtime test-types
          pnpm --filter @easy-editor/agent-runtime build
          pnpm --filter @easy-editor/agent-runtime types

      - name: Verify instance-based plugin and renderer graph
        run: |
          pnpm --filter @easy-editor/plugin-dashboard lint
          pnpm --filter @easy-editor/plugin-dashboard test-types
          pnpm --filter @easy-editor/plugin-dashboard test
          pnpm --filter @easy-editor/plugin-dashboard build
          pnpm --filter @easy-editor/plugin-dashboard types

          pnpm --filter @easy-editor/plugin-datasource lint
          pnpm --filter @easy-editor/plugin-datasource test-types
          pnpm --filter @easy-editor/plugin-datasource test
          pnpm --filter @easy-editor/plugin-datasource build
          pnpm --filter @easy-editor/plugin-datasource types

          pnpm --filter @easy-editor/plugin-hotkey lint
          pnpm --filter @easy-editor/plugin-hotkey test-types
          pnpm --filter @easy-editor/plugin-hotkey test
          pnpm --filter @easy-editor/plugin-hotkey build
          pnpm --filter @easy-editor/plugin-hotkey types

          pnpm --filter @easy-editor/renderer-core lint
          pnpm --filter @easy-editor/renderer-core test-types
          pnpm --filter @easy-editor/renderer-core test
          pnpm --filter @easy-editor/renderer-core build
          pnpm --filter @easy-editor/renderer-core types

          pnpm --filter @easy-editor/react-renderer lint
          pnpm --filter @easy-editor/react-renderer test-types
          pnpm --filter @easy-editor/react-renderer test
          pnpm --filter @easy-editor/react-renderer build
          pnpm --filter @easy-editor/react-renderer types

      - name: Verify Dashboard renderer
        run: |
          pnpm --filter @easy-editor/react-renderer-dashboard lint
          pnpm --filter @easy-editor/react-renderer-dashboard test-types
          pnpm --filter @easy-editor/react-renderer-dashboard test
          pnpm --filter @easy-editor/react-renderer-dashboard build
          pnpm --filter @easy-editor/react-renderer-dashboard types

      - name: Verify build tooling
        if: matrix.verify-easypack
        run: |
          pnpm --filter @easy-editor/easypack lint
          pnpm --filter @easy-editor/easypack types
          pnpm --filter @easy-editor/easypack build

      - name: Verify project generator
        run: |
          pnpm --filter @easy-editor/create lint
          pnpm --dir packages/create-easy-editor/template/dashboard/react lint
          pnpm --filter @easy-editor/create test
          pnpm --filter @easy-editor/create types
          pnpm --filter @easy-editor/create build

      - name: Verify packed release consumers
        if: matrix.verify-easypack
        run: pnpm --filter @easy-editor/create test:template-pack

      - name: Verify Dashboard runtime boundaries
        run: |
          pnpm --dir examples/dashboard lint
          NODE_OPTIONS=--experimental-global-webcrypto pnpm --dir examples/dashboard test
          pnpm --dir examples/dashboard build:deps
          pnpm --dir examples/dashboard exec tsc --project tsconfig.app.json --noEmit
          pnpm --dir examples/dashboard build:only

      - name: Verify published API baselines
        run: pnpm public-api:check

      - name: Build documentation
        run: pnpm --dir docs docs:build

  dashboard-browser:
    name: Dashboard lifecycle and Agent Runtime Golden (Chromium)
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --config.engine-strict=true

      - name: Install Chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: Verify Dashboard lifecycle in Chromium
        run: pnpm test:e2e

      - name: Verify credential-free Agent Runtime Golden and online lifecycle
        run: pnpm --dir examples/dashboard exec playwright test --config e2e/playwright.online-components.config.ts

      - name: Verify production-only online surface
        run: pnpm --dir examples/dashboard exec playwright test --config e2e/playwright.production-surface.config.ts

      - name: Upload Playwright evidence
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-${{ github.run_attempt }}
          path: |
            playwright-report/
            test-results/
            examples/dashboard/playwright-report/
            examples/dashboard/test-results/
            examples/dashboard/e2e/playwright-report/
            examples/dashboard/e2e/test-results/
          retention-days: 14

  dashboard-performance:
    name: Agent Runtime fixed-profile performance evidence (non-blocking)
    needs: quality
    runs-on: ubuntu-latest
    continue-on-error: true
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --config.engine-strict=true

      - name: Install Chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: Capture fixed-profile performance evidence
        run: pnpm exec playwright test --config=examples/dashboard/e2e/playwright.agent-runtime-performance.config.ts

      - name: Upload performance evidence
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: agent-runtime-performance-${{ github.run_attempt }}
          path: examples/dashboard/e2e/test-results/agent-runtime-performance/
          retention-days: 14

  portability:
    name: Generator and template smoke (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os:
          - macos-latest
          - windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --config.engine-strict=true

      - name: Verify generator and packaged template
        run: |
          pnpm build
          pnpm --filter @easy-editor/create lint
          pnpm --filter @easy-editor/create test
          pnpm --filter @easy-editor/create types
          pnpm --filter @easy-editor/create test:template-pack
